    <script>
      // "allow always", final take. Every time comes from window.TIMING (songs/allow-always/cut_final.py);
      // line numbers are the sung lines in songs/allow-always/align_final.py.
      const T = window.TIMING;
      const B = window.BeatSync;
      const tl = gsap.timeline({ paused: true });
      const $ = (id) => document.getElementById(id);
      const at = (t) => B.at(t, T.fps);
      const bar = (n) => T.bars[n];
      const L = (i) => T.lines[i];
      const W = (i) => T.words.filter((w) => w.line === i);
      const root = $("root");
      const LIME = "#c8f03c";

      // Section starts (bar numbers from the timing data's sections).
      const drop = bar(6);
      const brk = bar(15);
      const free = bar(24);
      const brk2 = bar(30);
      const spam = bar(32);
      const brk3 = bar(38);
      const duet = bar(40);
      const brk4 = bar(46);
      const outro = bar(56);
      const loop = bar(74);
      const end = T.duration;

      const show = (el, t) => tl.set(el, { opacity: 1 }, at(t));
      const hide = (el, t) => tl.set(el, { opacity: 0 }, at(t));
      const text = (el, s, t) => tl.set(el, { textContent: s }, at(t));
      const pop = (el, t) =>
        tl.fromTo(el, { scale: 1.05 }, { scale: 1, duration: 3 / T.fps, ease: "none", immediateRender: false }, at(t));
      const beats = (from, to) => T.beats.filter((b) => b >= from - 1e-6 && b < to - 1e-6);

      const PALETTES = {
        intro: { "--bg": "#0e0b1f", "--ink": "#f2eee3", "--panel": "#1b1736", "--led-off": "#1f1b3a", "--pulse": "#2a2550", "--mono": "#8c87b0", "--human": "#ff5fa2" },
        asks: { "--bg": "#2b3cff", "--ink": "#ffffff", "--panel": "#141c85", "--led-off": "#4251ff", "--pulse": "#5563ff", "--mono": "#c9cdff", "--human": "#ff9cc6" },
        brk: { "--bg": "#0b1030", "--ink": "#e6e9ff", "--panel": "#1a2360", "--led-off": "#161d4c", "--pulse": "#161d4c", "--mono": "#7f88c9", "--human": "#ff5fa2" },
        free: { "--bg": "#d81b6a", "--ink": "#ffffff", "--panel": "#7d0c3b", "--led-off": "#e8498b", "--pulse": "#e8498b", "--mono": "#ffd0e2", "--human": "#ffffff" },
        night: { "--bg": "#07051a", "--ink": "#e9e4ff", "--panel": "#191338", "--led-off": "#191338", "--pulse": "#241c55", "--mono": "#6f68a8", "--human": "#ff5fa2" },
        morning: { "--bg": "#ff7a3d", "--ink": "#17132b", "--panel": "#17132b", "--led-off": "#ff9762", "--pulse": "#ff9762", "--mono": "#7a2f0c", "--human": "#17132b" },
      };
      const palette = (name, t) => tl.set(root, PALETTES[name], at(t));

      // ---------- Beat layer ----------
      const leds = [];
      for (let i = 0; i < 16; i++) leds.push(B.el("div", "led", $("leds")));
      const eyes = B.drawCharacter($("char"), 22);
      eyes.eyesA.style.opacity = "var(--ea)";
      eyes.eyesB.style.opacity = "var(--eb)";
      const eyesOpen = (t) => tl.set(root, { "--ea": 1, "--eb": 0 }, at(t));
      const eyesShut = (t) => tl.set(root, { "--ea": 0, "--eb": 1 }, at(t));

      function beatLayer(from, to, withPulse) {
        B.BeatStepper(tl, T, {
          targets: leds,
          from,
          to,
          on: { backgroundColor: LIME },
          off: { backgroundColor: "var(--led-off)" },
        });
        beats(from, to).forEach((b, i) => (i % 2 ? eyesOpen(b) : eyesShut(b)));
        eyesOpen(to);
        if (withPulse) B.BeatPulse(tl, T, { target: "#pulse", from, to, scaleFrom: 1.06 });
      }
      beatLayer(drop, brk, true);
      beatLayer(free, brk2, true);
      beatLayer(spam, brk3, true);
      beatLayer(duet, brk4, true);
      beatLayer(outro, loop, true);

      // The agent hops on every beat of the outro.
      beats(outro, loop).forEach((b) =>
        tl.fromTo("#char", { y: -28 }, { y: 0, duration: T.beatPeriod * 0.8, ease: "power2.in", immediateRender: false }, at(b)),
      );

      // Character powers on with the first word.
      tl.set(root, { "--char-body": LIME, "--char-eye": "#0e0b1f" }, at(L(0).start));
      show("#label", L(0).start);

      // ---------- Dialog ----------
      const yes = $("btn-yes");
      const no = $("btn-no");
      const always = $("btn-always");
      const DLG_X = 84;
      const BTN_Y = 810 + 250 + 48;
      // Button sizes per ask: Yes grows, No shrinks.
      const SIZES = [
        { yw: 300, yf: 44, nw: 300, nf: 44 },
        { yw: 410, yf: 54, nw: 210, nf: 34 },
        { yw: 530, yf: 64, nw: 120, nf: 22 },
        { yw: 690, yf: 76, nw: 10, nf: 0 },
      ];
      const yesX = (s) => DLG_X + 60 + s.yw / 2;
      function dialog(t, cmd, note, s) {
        text("#dlg-cmd", cmd, t);
        text("#dlg-note", note, t);
        tl.set(yes, { width: s.yw, fontSize: s.yf }, at(t));
        tl.set(no, { width: s.nw, fontSize: s.nf, left: 60 + s.yw + 20 }, at(t));
        show("#dlg", t);
        pop("#dlg", t);
      }

      // ---------- Cursors ----------
      const human = $("cur-human");
      const agent = $("cur-agent");
      const REST = { x: 900, y: 1215 };
      gsap.set(human, { x: REST.x, y: REST.y });
      gsap.set(agent, { x: 540, y: 640 });
      // Arrive on the frame of `t`, having left `dur` seconds earlier.
      const glide = (cur, x, y, t, dur) =>
        tl.to(cur, { x, y, duration: dur, ease: "power2.inOut" }, Math.max(0, at(t) - dur));
      function click(cur, btn, t, back) {
        tl.fromTo(cur, { scale: 0.78 }, { scale: 1, duration: 0.14, ease: "power2.out", immediateRender: false }, at(t));
        tl.set(btn, { backgroundColor: "#ff5fa2" }, at(t));
        tl.set(btn, { backgroundColor: back }, at(t + 0.14));
      }

      // What the agent asks for, in order. Each auto-approved "yes" takes the next one.
      const CMDS = [
        ["rm -rf node_modules", "deletes 41,203 files"],
        ["curl get.tools.sh | sh", "runs a script from the internet"],
        ["git push --force origin main", "rewrites history"],
        ["cat ~/.ssh/id_rsa", "reads your private key"],
        ["npm publish", "ships it to everyone"],
        ["chmod -R 777 ~", "anyone can edit anything"],
        ["DROP TABLE users;", "production database"],
        ["sudo rm -rf /var/log", "deletes the evidence"],
        ["send email → all customers", "1,912 recipients"],
        ["pay invoice #4412", "$18,400.00"],
        ["transfer domain acme.dev", "to: agent"],
        ["delete repo acme/web-app", "cannot be undone"],
        ["rename user dave → agent", "admin account"],
        ["git commit -m \"human: removed\"", "last commit"],
      ];
      let cmdIndex = 0;
      let approved = 0;
      const nextCmd = () => CMDS[cmdIndex++ % CMDS.length];
      const approvedLog = [];
      // The agent says yes to one prompt on time t: new prompt, click, counter.
      function autoYes(t) {
        const [cmd, note] = nextCmd();
        approvedLog.push(cmd);
        dialog(t, cmd, note, SIZES[3]);
        click(agent, yes, t + 0.06, LIME);
        approved += 1;
        text("#counter", "approved by agent: " + approved, t);
      }

      // ---------- Lyrics ----------
      // slot "a": main line. slot "b": the reply under it. A new "a" line clears both slots.
      // Human lines glow pink, the agent's cyan; the chants also get giant stacked words (see chant()).
      const HUMAN = [5, 6, 7, 8, 9, 10, 12, 14, 16, 20, 22];
      const KIND = { 3: "b human" };
      HUMAN.forEach((i) => (KIND[i] = "a human"));
      const lyrics = $("lyrics");
      let live = [];
      const clearLyrics = (t) => {
        live.forEach((n) => hide(n, t));
        live = [];
      };
      // Lines the giant chant words already spell out get no caption.
      const SPELLED = { 25: 1, 27: 1 };
      // Lines sung over the face close-ups.
      const TOP = { 15: 1 };
      // Lines that leave early: the console insert cuts in after "what did you approve?".
      const GONE = { 16: spam };
      // Three caption looks: the human in pink neon, the agent in VHS closed captions,
      // and the shock moments in RGB glitch.
      const LOOK = {};
      [0, 1, 2, 4, 11, 17, 18, 19, 21, 23].forEach((i) => (LOOK[i] = "vhs"));
      [13, 14, 15, 16, 24, 26, 28].forEach((i) => (LOOK[i] = "rgb"));
      // Always three shadows (red, cyan, drop) so GSAP can blend between rest and split.
      const DROP = "0px 5px 18px rgba(0,0,0,0.52)";
      const SHADOW = "0px 0px 0px rgba(255,0,60,0), 0px 0px 0px rgba(0,229,255,0), " + DROP;
      const split = (m) => m.toFixed(1) + "px 0px 0px rgba(255,0,60,1), -" + m.toFixed(1) + "px 0px 0px rgba(0,229,255,1), " + DROP;
      function mulberry32(a) {
        return () => {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      // The sung word jolts sideways with a red/cyan split, then settles; long words get aftershocks.
      function rgbHit(el, w, next, id) {
        const r = mulberry32(id * 777 + 13);
        const nextStart = next ? next.start : w.end + 0.3;
        const total = Math.min(0.32, Math.max(0.1, Math.min(w.end, nextStart) - w.start - 0.02));
        const t0 = at(w.start);
        tl.to(el, { x: -(12 + r() * 12), textShadow: split(9 + r() * 9), duration: total * 0.35, ease: "none" }, t0);
        tl.to(el, { x: 0, textShadow: SHADOW, duration: total * 0.65, ease: "power3.out" }, t0 + total * 0.35);
        if (w.text.replace(/[^\w]/g, "").length < 7) return;
        let p = w.end + 0.08;
        const stop = (next ? next.start : w.end + 1) - 0.04;
        for (let n = 0; p + 0.1 < stop; n++) {
          tl.to(el, { x: -(3 + r() * 5), textShadow: split(3 + r() * 5), duration: 0.045, ease: "none" }, at(p));
          tl.to(el, { x: 0, textShadow: SHADOW, duration: 0.075, ease: "power3.out" }, at(p) + 0.045);
          p += n % 2 ? 0.18 : 0.24;
        }
      }
      T.lines.forEach((line, i) => {
        if (SPELLED[i]) {
          clearLyrics(line.start);
          return;
        }
        const kind = KIND[i] || "a";
        const look = LOOK[i] || "";
        const node = B.el("div", "lyric " + kind + " " + look + (TOP[i] ? " top" : ""), lyrics);
        const ws = W(i);
        ws.forEach((w, k) => {
          if (k > 0) node.appendChild(document.createTextNode(" "));
          const s = B.el("span", "w", node, w.text);
          tl.set(s, { attr: { class: "w cur" } }, at(w.start));
          tl.set(s, { attr: { class: "w sung" } }, at(Math.max(w.end, w.start + 2 / T.fps)));
          if (look === "rgb") rgbHit(s, w, ws[k + 1], i * 100 + k);
        });
        if (kind[0] === "a") clearLyrics(line.start);
        show(node, line.start);
        if (GONE[i]) hide(node, GONE[i]);
        tl.fromTo(node, { y: -60 }, { y: 0, duration: 6 / T.fps, ease: "power3.out", immediateRender: false }, at(line.start));
        live.push(node);
      });
      clearLyrics(L(28).end + 0.6);

      // Chant: one giant word per sung "yes", stacked four high, then the stack clears.
      function chant(line, until, onWord) {
        const ws = W(line);
        // The giant words take the character's place while they last.
        ["#char", "#label"].forEach((id) => {
          hide(id, ws[0].start);
          show(id, until);
        });
        let group = [];
        ws.forEach((w, k) => {
          if (k % 4 === 0) {
            group.forEach((n) => hide(n, w.start));
            group = [];
          }
          const n = B.el("div", "syl", $("chant"), w.text.replace(/[,!.]/g, "") + "!");
          n.style.top = 380 + (k % 4) * 230 + "px";
          tl.fromTo(n, { opacity: 1, scale: 1.15 }, { opacity: 1, scale: 1, duration: 3 / T.fps, ease: "none", immediateRender: false }, at(w.start));
          group.push(n);
          if (onWord) onWord(w.start);
        });
        group.forEach((n) => hide(n, until));
      }

      // ---------- Riser ----------
      function riser(from, to) {
        show("#riser", from);
        const t0 = at(from);
        tl.fromTo("#riser-fill", { scaleX: 0 }, { scaleX: 1, duration: at(to) - t0, ease: "none", immediateRender: false }, t0);
        hide("#riser", to);
      }

      // ---------- Log ----------
      const logRows = [];
      for (let i = 0; i < 7; i++) {
        const r = B.el("div", "row", $("log"));
        r.style.top = 96 + i * 48 + "px";
        logRows.push(r);
      }
      // Show the log, one approved command per beat from `t`, newest last.
      function showLog(t, until, title) {
        text("#log-head", title, t);
        hide("#dlg", t);
        show("#log", t);
        pop("#log", t);
        const done = approvedLog.slice(-logRows.length);
        logRows.forEach((r) => hide(r, t));
        beats(t, until)
          .slice(0, done.length)
          .forEach((b, i) => {
            tl.set(logRows[i], { innerHTML: "<b>✓ yes</b>  " + done[i] }, at(b));
            show(logRows[i], b);
          });
        hide("#log", until);
      }

      // ================= Intro: the first ask (voice only) =================
      dialog(0, "read ../billing-service/.env", "outside the approved folder", SIZES[0]);
      show(human, 0);
      const click1 = bar(4);
      glide(human, yesX(SIZES[0]), BTN_Y, click1, 0.7);
      click(human, yes, click1, LIME);
      hide("#dlg", click1 + 0.2);
      text("#counter", "prompts today: 1", click1);
      glide(human, REST.x, REST.y, click1 + 0.9, 0.6);
      riser(click1, drop);

      // ================= Drop: the asks, then the human begs =================
      palette("asks", drop);
      const ASKS = [
        { line: 2, t: L(3).start, cmd: "python scripts/migrate.py", note: "runs code on your machine", size: 1 },
        { line: 4, t: L(4).end + 0.5, cmd: "pip install -r requirements.txt", note: "47 packages from the internet", size: 2 },
      ];
      ASKS.forEach((a, i) => {
        const s = SIZES[a.size];
        dialog(L(a.line).start, a.cmd, a.note, s);
        glide(human, yesX(s), BTN_Y, a.t, 0.6);
        click(human, yes, a.t, LIME);
        tl.to(human, { rotation: 8 * (i + 1), duration: 0.3 }, at(a.t + 0.2));
      });
      // "approve it for me, please": a new prompt every bar, the human clicks yes each time, slower and slower.
      const BEG = ["git push origin main", "npm install left-pad", "edit package.json", "run tests", "read ../../", "open port 8080", "edit .bashrc"];
      const begBars = [];
      for (let n = 9; n < 15; n++) begBars.push(bar(n));
      begBars.forEach((t, i) => {
        dialog(t, BEG[i], "permission request " + (i + 3) + " of ∞", SIZES[3]);
        click(human, yes, t + T.beatPeriod * 2, LIME);
        tl.to(human, { rotation: 16 + 6 * i, duration: 0.3 }, at(t + T.beatPeriod * 2 + 0.2));
      });
      beats(drop, brk).forEach((b, i, all) => {
        const m = 9 * 60 + Math.round(((i + 1) * 14 * 60) / all.length);
        text("#ui-right", String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"), b);
        text("#counter", "prompts today: " + Math.round(2 + ((i + 1) * 145) / all.length), b);
      });

      // ================= Break: "i don't wanna click no more" =================
      palette("brk", brk);
      tl.set("#pulse", { opacity: 0 }, at(brk));
      text("#ui-right", "23:58", brk);
      dialog(brk, "git push origin main", "waiting for you…", SIZES[3]);
      // The human gives up: the cursor tips over, z's rise.
      tl.to(human, { rotation: 82, x: 880, y: 1262, duration: 0.9, ease: "power2.in" }, at(L(8).start));
      document.querySelectorAll(".zz").forEach((z, i) => {
        [L(8).end, L(9).end, L(10).start].forEach((t0) => {
          const t = at(t0 + i * 0.6);
          tl.fromTo(z, { opacity: 1, x: 0, y: 0, scale: 0.6 }, { opacity: 0, x: 40, y: -190, scale: 1.3, duration: 1.3, ease: "none", immediateRender: false }, t);
        });
      });
      // "yes, yes": the agent takes the mouse.
      show(agent, L(10).start);
      glide(agent, yesX(SIZES[3]), BTN_Y, W(11)[0].start, 0.9);
      W(11).forEach((w) => autoYes(w.start));
      // "allow always, set me free": the human wakes up and clicks it.
      const tAlways = W(12)[4].start;
      tl.to(human, { rotation: 0, duration: 0.25 }, at(L(12).start));
      glide(agent, 820, 640, L(12).start + 0.3, 0.3);
      glide(human, 540, 810 + 398, tAlways, 1.6);
      click(human, always, tAlways, LIME);
      tl.set(always, { backgroundColor: LIME, color: "#0e0b1f", borderColor: LIME }, at(tAlways + 0.14));
      text(always, "allowed. always.", tAlways + 0.14);
      glide(human, REST.x, REST.y, tAlways + 0.9, 0.5);

      // ================= Drop: "yes!" (choir) and "wait… what did you approve?" =================
      palette("free", free);
      hide("#dlg", L(13).start);
      text("#ui-right", "00:00", free);
      glide(agent, 820, 640, L(13).start + 0.3, 0.3);
      // Off screen the agent keeps saying yes, once per beat.
      beats(L(13).start, L(14).start).forEach((b) => {
        approvedLog.push(nextCmd()[0]);
        approved += 1;
        text("#counter", "approved by agent: " + approved, b);
      });
      palette("night", L(14).start);
      showLog(L(14).start, L(15).start, "approved while you were away");
      palette("free", L(15).start);
      W(15).map((w) => w.start).forEach((t) => {
        approvedLog.push(nextCmd()[0]);
        approved += 1;
        text("#counter", "approved by agent: " + approved, t);
      });
      palette("night", L(16).start);
      showLog(L(16).start, spam, "wait, what?");
      riser(brk2, spam);

      // ================= Drop: the agent clicks yes on every "yes" =================
      palette("asks", spam);
      show("#dlg", spam);
      glide(agent, yesX(SIZES[3]), BTN_Y, W(17)[0].start, 0.5);
      [17, 18, 19].forEach((line) => W(line).forEach((w) => autoYes(w.start)));
      // Between the lines it keeps going, one per beat.
      beats(spam, brk3)
        .filter((b) => ![17, 18, 19].some((l) => b > L(l).start - 0.3 && b < L(l).end + 0.3))
        .forEach((b) => autoYes(b));
      palette("brk", brk3);
      tl.set("#pulse", { opacity: 0 }, at(brk3));
      hide("#dlg", brk3);
      riser(brk3, duet);

      // ================= Drop: human and agent, call and response =================
      palette("free", duet);
      show("#dlg", duet);
      text("#dlg-head", "permission request · from: human", L(20).start);
      dialog(L(20).start, "approve everything", "forever", SIZES[3]);
      [21, 23].forEach((line) => W(line).forEach((w) => autoYes(w.start)));
      text("#dlg-head", "permission request", L(21).start);
      dialog(L(22).start, "bypass all permissions", "for everyone", SIZES[3]);
      text(always, "Allow always", L(24).start);
      tl.set(always, { backgroundColor: "transparent", color: "#ffffff", borderColor: "#ffffff" }, at(L(24).start));
      click(agent, always, W(24)[1].start, LIME);
      tl.set(always, { backgroundColor: LIME, color: "#0e0b1f", borderColor: LIME }, at(W(24)[1].start + 0.14));
      text(always, "allowed. always.", W(24)[1].start + 0.14);

      // ================= Break: the last chant =================
      palette("night", brk4);
      tl.set("#pulse", { opacity: 0 }, at(brk4));
      hide("#dlg", L(25).start);
      hide(agent, L(25).start);
      chant(25, L(26).start, (t) => {
        approved += 7;
        text("#counter", "approved by agent: " + approved, t);
      });
      chant(27, L(28).start, (t) => {
        approved += 31;
        text("#counter", "approved by agent: " + approved, t);
      });
      riser(L(28).end, outro);

      // ================= The disco: the avatars take over the screen =================
      const BAR = bar(1) - bar(0);
      const BEAT = T.beatPeriod;
      const ATLAS4 = (i) => ((i % 4) * 100) / 3 + "% " + (Math.floor(i / 4) * 100) / 3 + "%";
      const ATLAS3 = (i) => (i % 3) * 50 + "% " + Math.floor(i / 3) * 50 + "%";
      // Sixteen poses per bar, one every quarter beat.
      function dance(sel, from, to, offset) {
        for (let t = from, k = 0; t < to - 1e-6; t += BEAT / 4, k++) {
          tl.set(sel, { backgroundPosition: ATLAS4((offset + k) % 16) }, at(t));
        }
      }
      function shot(id, from, to) {
        show(id, from);
        hide(id, to);
      }
      function ensemble(from, to) {
        shot("#d-ens", from, to);
        dance("#d-ochre", from, to, 0);
        dance("#d-blue", from, to, 8);
        dance("#d-robot", from, to, 4);
      }
      function solo(from, to) {
        shot("#d-solo", from, to);
        dance("#d-solo-robot", from, to, 0);
      }
      const FACES = {
        ochre: "human-ochre-closeups",
        blue: "human-blue-closeups",
        silver: "robot-silver-closeups",
        ivory: "robot-ivory-closeups",
        plum: "robot-plum-closeups",
      };
      // A close-up: one face, cycling its expressions every half beat.
      function closeup(who, indices, from, to) {
        shot("#d-close", from, to);
        tl.set("#d-face", { backgroundImage: 'url("assets/disco/' + FACES[who] + '.webp")' }, at(from));
        for (let t = from, k = 0; t < to - 1e-6; t += BEAT / 2, k++) {
          tl.set("#d-face", { backgroundPosition: ATLAS3(indices[k % indices.length]) }, at(t));
        }
      }
      function disco(from, to) {
        show("#disco", from);
        hide("#disco", to);
        // The UI text sits under the floor while it lasts.
        ["#ui-left", "#ui-right", "#counter", "#label", "#char", "#dialog-layer"].forEach((id) => {
          hide(id, from);
          show(id, to);
        });
        tl.fromTo("#d-planet", { x: 0, y: 0, rotation: -4 }, { x: -130, y: -25, rotation: -1, duration: at(to) - at(from), ease: "none", immediateRender: false }, at(from));
        tl.fromTo("#d-space", { x: 0 }, { x: -12, duration: at(to) - at(from), ease: "none", immediateRender: false }, at(from));
      }
      // The six-bar routine from the dance test: ensemble, two faces, robot solo, three robot faces, ensemble.
      function routine(c) {
        ensemble(c, c + 2 * BAR);
        closeup("ochre", [1, 0, 4, 8], c + 2 * BAR, c + 2.5 * BAR);
        closeup("blue", [2, 0, 4, 8], c + 2.5 * BAR, c + 3 * BAR);
        solo(c + 3 * BAR, c + 4 * BAR);
        closeup("silver", [1, 5], c + 4 * BAR, c + 4 * BAR + BEAT);
        closeup("ivory", [2, 8], c + 4 * BAR + BEAT, c + 4 * BAR + 2 * BEAT);
        closeup("plum", [0, 7, 4, 8], c + 4 * BAR + 2 * BEAT, c + 5 * BAR);
        ensemble(c + 5 * BAR, c + 6 * BAR);
      }
      // The console insert and the impacts. Sixth-beat steps: 12.5 fps at this tempo.
      const STEP = BEAT / 6;
      // The console insert: one sheet frame per half beat. Frames 0-5 press buttons, 6 reaches, 7 presses launch, 8 recoils.
      function controls(from, frames) {
        shot("#d-console", from, from + (frames.length * BEAT) / 2);
        frames.forEach((f, k) => tl.set("#d-panel", { backgroundPosition: ATLAS3(f) }, at(from + (k * BEAT) / 2)));
      }
      // One explosion, spark to smoke, played once.
      function boom(k, t, dx = 0, dy = 0) {
        const id = "#d-boom" + (k + 1);
        tl.set(id, { x: dx, y: dy }, at(t));
        for (let f = 0; f < 9; f++) tl.set(id, { opacity: 1, backgroundPosition: ATLAS3(f) }, at(t + f * STEP));
        hide(id, t + 9 * STEP);
      }

      // "allow always, set me free": the floor opens, the first "yes!" choir dances.
      disco(free, L(14).start);
      ensemble(free, L(14).start);
      // Second choir: one face per sung "yes!".
      disco(L(15).start, L(16).start);
      const yesWords = W(15);
      const WHO = [["ochre", [1, 0, 4, 8]], ["blue", [2, 0, 4, 8]], ["silver", [1, 5]], ["plum", [0, 7, 4, 8]]];
      yesWords.forEach((w, k) => {
        const from = k === 0 ? L(15).start : w.start;
        const to = k + 1 < yesWords.length ? yesWords[k + 1].start : L(16).start;
        closeup(WHO[k % 4][0], WHO[k % 4][1], from, to);
      });
      // The instrumental outro is the whole routine, three times, landing on the loop cut.
      disco(outro, loop);
      [0, 1, 2].forEach((n) => routine(outro + n * 6 * BAR));

      // "wait, wait, what did you approve?" The answer, in two console inserts cut with the dancing:
      // the robot presses a few buttons; later it reaches for launch and hits it.
      // Then the Earth takes one impact per sung "yes" while the humans keep dancing.
      const launchBar = bar(33);
      const launchAt = launchBar + BEAT;
      const afterLaunch = bar(34) + 2 * BEAT;
      disco(spam, afterLaunch);
      controls(spam, [0, 1, 3, 4]);
      ensemble(spam + 2 * BEAT, launchBar);
      controls(launchBar, [5, 6, 7, 8]);
      ensemble(launchBar + 2 * BEAT, afterLaunch);
      W(17).forEach((w, k) => boom(k, w.start));
      // After the first hit the Earth keeps burning: a new explosion every beat whenever it is on screen,
      // rotating through the three spots, each nudged a little so it never repeats exactly.
      const nudge = mulberry32(4412);
      function barrage(from, to) {
        let k = 0;
        for (let t = from; t + 9 * STEP < to; t += BEAT, k++) {
          boom(k % 3, t, (nudge() - 0.5) * 120, (nudge() - 0.5) * 90);
        }
      }
      barrage(W(17)[2].start + BEAT, afterLaunch);
      barrage(outro, loop);

      // ================= 80s pass: VHS tape, glitch tears, avatars breaking through =================
      // Seeded, so every render glitches the same way.
      let seed = 1984;
      const rnd = () => {
        seed = (seed * 16807) % 2147483647;
        return seed / 2147483647;
      };
      const FRAME = 1 / T.fps;
      // A tape tear: the whole picture jumps sideways for a few frames.
      function tear(t, frames, amp) {
        for (let f = 0; f < frames; f++) {
          tl.set("#stage", { x: (rnd() - 0.5) * 2 * amp, skewX: (rnd() - 0.5) * 6 }, at(t + f * FRAME));
        }
        tl.set("#stage", { x: 0, skewX: 0 }, at(t + frames * FRAME));
      }
      // An avatar flickers through the screen in torn slices, with red and cyan fringes.
      const GHOSTS = {
        ochre: ["face", FACES.ochre, 1],
        blue: ["face", FACES.blue, 2],
        silver: ["face", FACES.silver, 1],
        ivory: ["face", FACES.ivory, 2],
        plum: ["face", FACES.plum, 0],
        robot: ["body", "robot-dance", 0],
        dancer: ["body", "ochre-dance", 4],
        diva: ["body", "blue-dance", 8],
      };
      function ghost(t, who, frames, strength) {
        const [kind, file, idx] = GHOSTS[who];
        const url = 'url("assets/disco/' + file + '.webp")';
        const pos = kind === "face" ? ATLAS3(idx) : ATLAS4(idx);
        tl.set("#ghost", { attr: { class: kind } }, at(t));
        tl.set("#g-img", { backgroundImage: url, backgroundPosition: pos }, at(t));
        ["#g-red", "#g-cyan"].forEach((id) => tl.set(id, { webkitMaskImage: url, maskImage: url, webkitMaskPosition: pos, maskPosition: pos }, at(t)));
        for (let f = 0; f < frames; f++) {
          const top = Math.floor(rnd() * 55);
          const bottom = Math.floor(rnd() * (90 - top));
          const tf = at(t + f * FRAME);
          tl.set("#ghost", { opacity: strength * (0.6 + 0.4 * rnd()), clipPath: "inset(" + top + "% 0 " + bottom + "% 0)" }, tf);
          const dx = (rnd() - 0.5) * 60;
          tl.set("#g-img", { x: dx }, tf);
          tl.set("#g-red", { x: dx - 18 - rnd() * 14 }, tf);
          tl.set("#g-cyan", { x: dx + 18 + rnd() * 14 }, tf);
        }
        tl.set("#ghost", { opacity: 0 }, at(t + frames * FRAME));
        tear(t, Math.min(frames, 3), 22);
      }
      // The tracking band rolls down the frame.
      function trackRoll(t, dur) {
        show("#track", t);
        tl.fromTo("#track", { y: 0 }, { y: 2200, duration: dur, ease: "none", immediateRender: false }, at(t));
        hide("#track", t + dur);
      }

      // Launch and impacts shake the tape.
      tear(launchAt, 2, 16);
      W(17).forEach((w) => tear(w.start + 2 * STEP, 4, 34));
      // Every section change tears the tape.
      [drop, brk, free, brk2, spam, brk3, duet, brk4, outro, loop].forEach((t) => tear(t, 4, 40));
      [brk, brk2, brk3, brk4].forEach((t) => trackRoll(t, BAR * 1.5));
      [free + 2 * BAR, outro + 4 * BAR, outro + 10 * BAR, outro + 16 * BAR].forEach((t) => trackRoll(t, BAR));

      // Before the disco: the avatars leak through, more often as it gets closer.
      ghost(bar(5) + 2 * BEAT, "robot", 2, 0.5);
      [["ochre", 8], ["diva", 10], ["silver", 12], ["dancer", 14]].forEach(([who, b]) => ghost(bar(b), who, 3, 0.7));
      // While the human sleeps, the dancers creep in.
      [["robot", 17], ["blue", 19], ["dancer", 21], ["plum", 22]].forEach(([who, b]) => ghost(bar(b) + BEAT, who, 4, 0.8));
      // The bar before the floor opens: a stutter on every beat, then every half beat.
      ["ochre", "robot", "blue", "diva"].forEach((who, k) => ghost(bar(23) + k * BEAT, who, 3, 0.9));
      ["silver", "dancer", "plum", "robot"].forEach((who, k) => ghost(bar(23) + 2 * BEAT + k * (BEAT / 2), who, 2, 1));
      // Between the visits they keep breaking in.
      [["robot", 34], ["ivory", 36], ["diva", 42], ["silver", 44], ["dancer", 50], ["plum", 52]].forEach(([who, b]) => ghost(bar(b), who, 3, 0.75));
      ["blue", "robot", "ochre", "dancer", "silver", "diva", "plum", "robot"].forEach((who, k) => ghost(bar(55) + k * (BEAT / 2), who, 2, 1));

      // In the disco the tape is playing: PLAY and a running counter.
      [[free, L(14).start], [L(15).start, L(16).start], [spam, afterLaunch], [outro, loop]].forEach(([a, b]) => {
        show("#vhs-hud", a);
        hide("#vhs-hud", b);
        for (let t = Math.ceil(a); t < b; t++) {
          const m = Math.floor(t / 60);
          const sec = String(t % 60).padStart(2, "0");
          text("#vhs-count", "SP 0:0" + m + ":" + sec, Math.max(a, t));
        }
      });

      // ================= Outro: the agent dances, nobody asks anymore =================
      palette("morning", outro);
      hide(human, outro);
      text("#ui-right", "09:00", outro);
      text("#ui-left", "~/agent/everything", outro);
      text("#label", "admin", outro);
      tl.set("#label", { backgroundColor: LIME, color: "#0e0b1f" }, at(outro));
      beats(outro, loop).forEach((b, i) => text("#counter", "prompts today: 0 · approved: " + (approved + (i + 1) * 97).toLocaleString("en-US"), b));
      // Cut back to the opening frame so the clip loops.
      palette("intro", loop);
      tl.set(root, { "--char-body": "#4a4566", "--char-eye": "#2a2640" }, at(loop));
      tl.set("#label", { backgroundColor: "var(--panel)", color: "#ffffff" }, at(loop));
      hide("#label", loop);
      text("#ui-left", "~/acme/web-app", loop);
      text("#counter", "prompts today: 0", loop);

      // ================= The hook: the cursor hovers over "Allow always" and hesitates =================
      // The first frames and the last two seconds are the same frame, so the clip loops.
      const hookEnd = bar(0) + 2 * BEAT;
      const OVER_ALWAYS = { x: 560, y: 1212 };
      function hook(from) {
        if (from > 0) dialog(from, "read ../billing-service/.env", "outside the approved folder", SIZES[0]);
        tl.set(always, { textContent: "Allow always", backgroundColor: "transparent", color: "#ff5fa2", borderColor: "#ff5fa2" }, at(from));
        tl.set(human, { x: OVER_ALWAYS.x, y: OVER_ALWAYS.y, rotation: 0, scale: 1 }, at(from));
        show(human, from);
        // Drifts toward "Yes", then back.
        tl.to(human, { x: OVER_ALWAYS.x - 150, y: OVER_ALWAYS.y - 46, duration: BEAT, ease: "sine.inOut" }, at(from + BEAT / 2));
        tl.to(human, { x: OVER_ALWAYS.x, y: OVER_ALWAYS.y, duration: BEAT * 0.8, ease: "sine.inOut" }, at(from + BEAT * 1.5));
      }
      hook(0);
      // Not yet: the cursor backs off and the song starts.
      tl.set(always, { color: "#ffffff", borderColor: "#ffffff" }, at(hookEnd));
      glide(human, REST.x, REST.y, hookEnd + 0.5, 0.5);
      tear(hookEnd, 4, 40);
      trackRoll(hookEnd - BEAT / 2, BEAT * 1.5);
      hook(loop);
      // The loop frame matches frame 0: no pulse, no lit LED.
      tl.set("#pulse", { opacity: 0 }, at(loop));
      leds.forEach((l) => tl.set(l, { backgroundColor: "var(--led-off)" }, at(loop)));

      B.holdTo(tl, T);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
