<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="src/beatsync.js"></script>
    <script src="data/allow-always.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0e0b1f;
      }
      #root {
        --bg: #0e0b1f;
        --ink: #f2eee3;
        --panel: #1b1736;
        --led-off: #1f1b3a;
        --pulse: #2a2550;
        --mono: #8c87b0;
        --human: #ff5fa2;
        --char-body: #4a4566;
        --char-eye: #2a2640;
        --ea: 1;
        --eb: 0;
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
        font-family: "JetBrains Mono", monospace;
      }
      #bg {
        position: absolute;
        inset: 0;
        background: var(--bg);
      }
      .mono {
        position: absolute;
        font-family: "JetBrains Mono", monospace;
        font-size: 34px;
        color: var(--mono);
        letter-spacing: 0.02em;
        white-space: nowrap;
      }
      #ui-left {
        left: 84px;
        top: 150px;
      }
      #ui-right {
        right: 84px;
        top: 150px;
        text-align: right;
      }
      #counter {
        left: 84px;
        top: 300px;
        font-size: 30px;
      }
      #leds {
        position: absolute;
        top: 236px;
        left: 84px;
        width: 912px;
        height: 40px;
        display: flex;
        gap: 8px;
      }
      .led {
        flex: 1;
        background: var(--led-off);
      }
      #pulse {
        position: absolute;
        left: 320px;
        top: 325px;
        width: 440px;
        height: 440px;
        background: var(--pulse);
        opacity: 0;
      }
      #char {
        position: absolute;
        left: 408px;
        top: 380px;
        width: 264px;
        height: 330px;
      }
      #label {
        position: absolute;
        left: 390px;
        top: 728px;
        width: 300px;
        height: 56px;
        line-height: 56px;
        text-align: center;
        font-size: 34px;
        background: var(--panel);
        color: #ffffff;
        opacity: 0;
      }

      /* Permission dialog and the 2FA sheet share one box. */
      .panel {
        position: absolute;
        left: 84px;
        top: 810px;
        width: 912px;
        height: 460px;
        background: var(--panel);
        color: #ffffff;
        opacity: 0;
        overflow: hidden;
      }
      .panel .head {
        position: absolute;
        left: 60px;
        top: 36px;
        font-size: 28px;
        color: #ffffff;
        opacity: 0.6;
        white-space: nowrap;
      }
      #dlg-cmd {
        position: absolute;
        left: 60px;
        top: 92px;
        font-size: 42px;
        font-weight: 700;
        white-space: nowrap;
      }
      #dlg-note {
        position: absolute;
        left: 60px;
        top: 170px;
        font-size: 30px;
        opacity: 0.75;
        white-space: nowrap;
      }
      .btn {
        position: absolute;
        height: 96px;
        line-height: 96px;
        text-align: center;
        font-family: "Inter", sans-serif;
        font-weight: 900;
        overflow: hidden;
        white-space: nowrap;
      }
      #btn-yes {
        left: 60px;
        top: 250px;
        width: 300px;
        font-size: 44px;
        background: #c8f03c;
        color: #0e0b1f;
      }
      #btn-no {
        left: 380px;
        top: 250px;
        width: 300px;
        font-size: 44px;
        background: #ffffff;
        color: #0e0b1f;
      }
      #btn-always {
        left: 60px;
        top: 366px;
        width: 792px;
        height: 64px;
        line-height: 58px;
        font-family: "JetBrains Mono", monospace;
        font-weight: 400;
        font-size: 30px;
        border: 3px solid #ffffff;
        color: #ffffff;
      }
      #sheet-title {
        position: absolute;
        left: 60px;
        top: 80px;
        font-family: "Inter", sans-serif;
        font-weight: 900;
        font-size: 56px;
        letter-spacing: -0.03em;
        white-space: nowrap;
      }
      #sheet-note {
        position: absolute;
        left: 60px;
        top: 160px;
        font-size: 26px;
        opacity: 0.75;
        white-space: nowrap;
      }
      #boxes {
        position: absolute;
        left: 60px;
        top: 216px;
        display: flex;
        gap: 18px;
      }
      .box {
        width: 117px;
        height: 130px;
        line-height: 130px;
        text-align: center;
        font-size: 80px;
        font-weight: 700;
        background: rgba(255, 255, 255, 0.14);
        color: #ffffff;
      }
      .box span {
        opacity: 0;
        display: inline-block;
      }
      #mail {
        position: absolute;
        left: 60px;
        top: 374px;
        width: 792px;
        height: 60px;
        line-height: 60px;
        padding: 0 20px;
        font-size: 26px;
        background: #ffffff;
        color: #0e0b1f;
        white-space: nowrap;
        opacity: 0;
      }
      #mail-state {
        position: absolute;
        right: 20px;
        top: 0;
        font-weight: 700;
      }

      /* 03:00 standup grid. */
      #grid {
        position: absolute;
        left: 84px;
        top: 350px;
        width: 912px;
        height: 920px;
        opacity: 0;
      }
      .tile {
        position: absolute;
        width: 290px;
        height: 215px;
        background: var(--panel);
        outline: 6px solid transparent;
        outline-offset: -6px;
        opacity: 0;
      }
      .tile svg {
        position: absolute;
        left: 97px;
        top: 26px;
      }
      .tile .tag {
        position: absolute;
        left: 12px;
        bottom: 12px;
        padding: 0 12px;
        height: 38px;
        line-height: 38px;
        font-size: 24px;
        background: #000000;
        color: #ffffff;
      }
      .fridge {
        position: absolute;
        left: 110px;
        top: 26px;
        width: 70px;
        height: 124px;
        background: #e9e4ff;
      }
      .fridge::before {
        content: "";
        position: absolute;
        left: 0;
        top: 40px;
        width: 70px;
        height: 4px;
        background: #07051a;
      }
      .fridge::after {
        content: "";
        position: absolute;
        left: 54px;
        top: 54px;
        width: 6px;
        height: 30px;
        background: #07051a;
      }
      #chant {
        position: absolute;
        inset: 0;
      }
      .syl {
        position: absolute;
        left: 84px;
        font-family: "Inter", sans-serif;
        font-weight: 900;
        font-size: 270px;
        line-height: 250px;
        letter-spacing: -0.05em;
        color: #c8f03c;
        white-space: nowrap;
        opacity: 0;
      }

      /* Lyrics. */
      #lyrics {
        position: absolute;
        inset: 0;
      }
      .lyric {
        position: absolute;
        left: 84px;
        width: 930px;
        font-family: "Inter", sans-serif;
        font-weight: 900;
        font-size: 92px;
        line-height: 98px;
        letter-spacing: -0.045em;
        color: var(--ink);
        opacity: 0;
      }
      .lyric.a {
        top: 1330px;
      }
      .lyric.b {
        top: 1640px;
      }
      .lyric.human {
        color: var(--human);
      }
      .lyric.self {
        color: #c8f03c;
      }
      .lyric.big {
        top: 1290px;
        font-size: 400px;
        line-height: 400px;
      }
      .w.cur {
        color: #c8f03c;
      }
      .w.sung {
        color: var(--mono);
      }
      #riser {
        position: absolute;
        left: 84px;
        top: 1790px;
        width: 912px;
        height: 12px;
        background: var(--led-off);
        opacity: 0;
      }
      #riser-fill {
        width: 100%;
        height: 100%;
        background: #c8f03c;
        transform-origin: 0 50%;
      }
      .cursor {
        position: absolute;
        left: 0;
        top: 0;
        width: 60px;
        height: 84px;
        transform-origin: 0 0;
        opacity: 0;
      }
      .zz {
        position: absolute;
        left: 930px;
        top: 1180px;
        font-family: "Inter", sans-serif;
        font-weight: 900;
        font-size: 70px;
        color: #ffffff;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="59.8454"
      data-fps="60"
      data-width="1080"
      data-height="1920"
    >
      <audio id="music" class="clip" src="assets/dev/allow-always.wav" data-start="0" data-track-index="0" data-volume="1"></audio>
      <div id="bg"></div>
      <div id="ui-left" class="mono">~/acme/web-app</div>
      <div id="ui-right" class="mono">09:00</div>
      <div id="leds"></div>
      <div id="counter" class="mono">prompts today: 0</div>
      <div id="pulse"></div>
      <svg id="char"></svg>
      <div id="label">agent</div>

      <div id="dlg" class="panel">
        <div id="dlg-head" class="head">permission request</div>
        <div id="dlg-cmd">read ../billing-service/.env</div>
        <div id="dlg-note">outside the approved folder</div>
        <div id="btn-yes" class="btn">Yes</div>
        <div id="btn-no" class="btn">No</div>
        <div id="btn-always" class="btn">Allow always</div>
      </div>

      <div id="sheet" class="panel">
        <div class="head">acme sso</div>
        <div id="sheet-title">confirm it's you</div>
        <div id="sheet-note">enter the 6-digit code we sent to dave@acme.dev</div>
        <div id="boxes"></div>
        <div id="mail">inbox · your code is 481516<span id="mail-state">unread</span></div>
      </div>

      <div id="grid"></div>
      <div id="chant"></div>
      <div id="lyrics"></div>
      <div id="riser"><div id="riser-fill"></div></div>

      <div class="zz">z</div>
      <div class="zz">z</div>
      <div class="zz">z</div>
      <svg id="cur-human" class="cursor" viewBox="0 0 50 72">
        <path d="M2 2 L2 60 L17 46 L28 70 L39 65 L28 42 L48 42 Z" fill="#ffffff" stroke="#0e0b1f" stroke-width="4" />
      </svg>
      <svg id="cur-agent" class="cursor" viewBox="0 0 50 72">
        <path d="M2 2 L2 60 L17 46 L28 70 L39 65 L28 42 L48 42 Z" fill="#c8f03c" stroke="#0e0b1f" stroke-width="4" />
      </svg>
    </div>
    <script>
      // "allow always": scene plan. Every time comes from window.TIMING (songs/allow-always/cut.py).
      const T = window.TIMING;
      const B = window.BeatSync;
      const tl = gsap.timeline({ paused: true });
      const $ = (id) => document.getElementById(id);
      const at = (t) => B.at(t, T.fps);
      const bar = (n) => T.bars[n];
      const L = (i) => T.lines[i];
      const root = $("root");
      const LIME = "#c8f03c";

      // Section starts (bar numbers from the timing data's sections).
      const drop = bar(7);
      const brk = bar(13);
      const gmail = bar(15);
      const night = bar(18);
      const nightDrop = bar(19);
      const chant = L(22).start;
      const morning = bar(27);
      const cut = L(26).start + 0.45;
      const end = T.duration;

      const show = (el, t) => tl.set(el, { opacity: 1 }, at(t));
      const hide = (el, t) => tl.set(el, { opacity: 0 }, at(t));
      const text = (el, s, t) => tl.set(el, { textContent: s }, at(t));
      const pop = (el, t) =>
        tl.fromTo(el, { scale: 1.05 }, { scale: 1, duration: 3 / T.fps, ease: "none", immediateRender: false }, at(t));
      const beats = (from, to) => T.beats.filter((b) => b >= from - 1e-6 && b < to - 1e-6);

      const PALETTES = {
        intro: { "--bg": "#0e0b1f", "--ink": "#f2eee3", "--panel": "#1b1736", "--led-off": "#1f1b3a", "--pulse": "#2a2550", "--mono": "#8c87b0", "--human": "#ff5fa2" },
        asks: { "--bg": "#2b3cff", "--ink": "#ffffff", "--panel": "#141c85", "--led-off": "#4251ff", "--pulse": "#5563ff", "--mono": "#c9cdff", "--human": "#ff9cc6" },
        brk: { "--bg": "#0b1030", "--ink": "#e6e9ff", "--panel": "#1a2360", "--led-off": "#161d4c", "--pulse": "#161d4c", "--mono": "#7f88c9", "--human": "#ff5fa2" },
        gmail: { "--bg": "#d81b6a", "--ink": "#ffffff", "--panel": "#7d0c3b", "--led-off": "#e8498b", "--pulse": "#e8498b", "--mono": "#ffd0e2", "--human": "#ffffff" },
        night: { "--bg": "#07051a", "--ink": "#e9e4ff", "--panel": "#191338", "--led-off": "#191338", "--pulse": "#241c55", "--mono": "#6f68a8", "--human": "#ff5fa2" },
        morning: { "--bg": "#ff7a3d", "--ink": "#17132b", "--panel": "#17132b", "--led-off": "#ff9762", "--pulse": "#ff9762", "--mono": "#7a2f0c", "--human": "#17132b" },
      };
      const palette = (name, t) => tl.set(root, PALETTES[name], at(t));

      // ---------- Beat layer ----------
      const leds = [];
      for (let i = 0; i < 16; i++) leds.push(B.el("div", "led", $("leds")));
      const eyes = B.drawCharacter($("char"), 22);
      eyes.eyesA.style.opacity = "var(--ea)";
      eyes.eyesB.style.opacity = "var(--eb)";
      const eyesOpen = (t) => tl.set(root, { "--ea": 1, "--eb": 0 }, at(t));
      const eyesShut = (t) => tl.set(root, { "--ea": 0, "--eb": 1 }, at(t));

      function beatLayer(from, to, withPulse) {
        B.BeatStepper(tl, T, {
          targets: leds,
          from,
          to,
          on: { backgroundColor: LIME },
          off: { backgroundColor: "var(--led-off)" },
        });
        beats(from, to).forEach((b, i) => (i % 2 ? eyesOpen(b) : eyesShut(b)));
        eyesOpen(to);
        if (withPulse) B.BeatPulse(tl, T, { target: "#pulse", from, to, scaleFrom: 1.06 });
      }
      beatLayer(drop, brk, true);
      beatLayer(gmail, night, true);
      beatLayer(nightDrop, morning, false);

      // Character powers on with the first word.
      tl.set(root, { "--char-body": LIME, "--char-eye": "#0e0b1f" }, at(L(0).start));
      show("#label", L(0).start);

      // ---------- Dialog ----------
      const yes = $("btn-yes");
      const no = $("btn-no");
      const always = $("btn-always");
      const DLG_X = 84;
      const BTN_Y = 810 + 250 + 48;
      // Button sizes per ask: Yes grows, No shrinks.
      const SIZES = [
        { yw: 300, yf: 44, nw: 300, nf: 44 },
        { yw: 410, yf: 54, nw: 210, nf: 34 },
        { yw: 530, yf: 64, nw: 120, nf: 22 },
        { yw: 690, yf: 76, nw: 10, nf: 0 },
      ];
      const MORNING = { yw: 10, yf: 0, nw: 690, nf: 76 };
      const yesX = (s) => DLG_X + 60 + s.yw / 2;
      const noX = (s) => DLG_X + 60 + s.yw + 20 + s.nw / 2;
      function dialog(t, cmd, note, s) {
        text("#dlg-cmd", cmd, t);
        text("#dlg-note", note, t);
        tl.set(yes, { width: s.yw, fontSize: s.yf }, at(t));
        tl.set(no, { width: s.nw, fontSize: s.nf, left: 60 + s.yw + 20 }, at(t));
        show("#dlg", t);
        pop("#dlg", t);
      }

      // ---------- Cursors ----------
      const human = $("cur-human");
      const agent = $("cur-agent");
      const REST = { x: 900, y: 1215 };
      gsap.set(human, { x: REST.x, y: REST.y });
      gsap.set(agent, { x: 540, y: 640 });
      // Arrive on the frame of `t`, having left `dur` seconds earlier.
      const glide = (cur, x, y, t, dur) =>
        tl.to(cur, { x, y, duration: dur, ease: "power2.inOut" }, Math.max(0, at(t) - dur));
      function click(cur, btn, t, back) {
        tl.fromTo(cur, { scale: 0.78 }, { scale: 1, duration: 0.14, ease: "power2.out", immediateRender: false }, at(t));
        tl.set(btn, { backgroundColor: "#ff5fa2" }, at(t));
        tl.set(btn, { backgroundColor: back }, at(t + 0.14));
      }

      // ---------- Lyrics ----------
      // slot "a": main line. slot "b": the reply under it. A new "a" line clears both slots.
      const KIND = { 3: "b human", 5: "b human", 8: "b human", 9: "a human", 13: "b self", 24: "a human", 25: "a human", 26: "a big" };
      const SKIP = { 22: 1, 23: 1 };
      const lyrics = $("lyrics");
      let live = [];
      const clearLyrics = (t) => {
        live.forEach((n) => hide(n, t));
        live = [];
      };
      T.lines.forEach((line, i) => {
        if (SKIP[i]) return;
        const kind = KIND[i] || "a";
        const node = B.el("div", "lyric " + kind, lyrics);
        const karaoke = kind === "a";
        T.words
          .filter((w) => w.line === i)
          .forEach((w, k) => {
            if (k > 0) node.appendChild(document.createTextNode(" "));
            const s = B.el("span", "w", node, w.text);
            if (karaoke) {
              tl.set(s, { attr: { class: "w cur" } }, at(w.start));
              tl.set(s, { attr: { class: "w sung" } }, at(w.end));
            }
          });
        if (kind[0] === "a") clearLyrics(line.start);
        show(node, line.start);
        tl.fromTo(
          node,
          { y: -60 },
          { y: 0, duration: 6 / T.fps, ease: "power3.out", immediateRender: false },
          at(line.start),
        );
        live.push(node);
        if (i === 21) clearLyrics(chant);
      });
      clearLyrics(cut);

      // ---------- Riser ----------
      function riser(from, to) {
        show("#riser", from);
        const t0 = at(from);
        tl.fromTo("#riser-fill", { scaleX: 0 }, { scaleX: 1, duration: at(to) - t0, ease: "none", immediateRender: false }, t0);
        hide("#riser", to);
      }

      // ================= Scene 1: the first ask (voice only) =================
      dialog(L(0).start, "read ../billing-service/.env", "outside the approved folder", SIZES[0]);
      show(human, L(0).start);
      const click1 = bar(4);
      glide(human, yesX(SIZES[0]), BTN_Y, click1, 0.7);
      click(human, yes, click1, LIME);
      hide("#dlg", click1 + 0.2);
      text("#counter", "prompts today: 1", click1);
      glide(human, REST.x, REST.y, click1 + 0.9, 0.6);
      riser(click1, drop);

      // ================= Scene 2: the asks (drop) =================
      const ASKS = [
        { line: 2, yesLine: 3, cmd: "python scripts/migrate.py", note: "runs code on your machine", size: 1 },
        { line: 4, yesLine: 5, cmd: "pip install -r requirements.txt", note: "47 packages from the internet", size: 2 },
        { line: 6, yesLine: 8, cmd: "git push origin main", note: "skips review", size: 3 },
      ];
      ASKS.forEach((a, i) => {
        const s = SIZES[a.size];
        const t = L(a.yesLine).start;
        dialog(L(a.line).start, a.cmd, a.note, s);
        glide(human, yesX(s), BTN_Y, t, 0.6);
        click(human, yes, t, LIME);
        // The cursor droops a little more after every yes.
        tl.to(human, { rotation: 10 * (i + 1), duration: 0.3 }, at(t + 0.2));
        if (i < 2) glide(human, REST.x, REST.y, t + 0.95, 0.6);
      });
      palette("asks", drop);
      text("#counter", "prompts today: 2", L(3).start);
      beats(drop, brk).forEach((b, i, all) => {
        const m = 9 * 60 + Math.round(((i + 1) * 14 * 60) / all.length);
        const hh = String(Math.floor(m / 60)).padStart(2, "0");
        const mm = String(m % 60).padStart(2, "0");
        text("#ui-right", hh + ":" + mm, b);
        text("#counter", "prompts today: " + Math.round(2 + ((i + 1) * 145) / all.length), b);
      });
      // "allow always": the cursor drags itself to the last button.
      const tAlways = L(9).start + 0.75;
      glide(human, 540, 810 + 398, tAlways, 1.1);
      click(human, always, tAlways, LIME);
      tl.set(always, { backgroundColor: LIME, color: "#0e0b1f", borderColor: LIME }, at(tAlways + 0.14));
      text(always, "allowed. always.", tAlways + 0.14);

      // ================= Scene 3: the code (break) =================
      for (let i = 0; i < 6; i++) B.el("span", "", B.el("div", "box", $("boxes")), "481516"[i]);
      const digits = Array.from(document.querySelectorAll(".box span"));
      const boxes = Array.from(document.querySelectorAll(".box"));
      palette("brk", brk);
      hide("#dlg", brk);
      show("#sheet", brk);
      pop("#sheet", brk);
      text("#ui-right", "23:58", brk);
      tl.set("#pulse", { opacity: 0 }, at(brk));
      // The human falls asleep: the cursor tips over, z's rise.
      tl.to(human, { rotation: 82, x: 880, y: 1262, duration: 0.9, ease: "power2.in" }, at(L(10).start));
      document.querySelectorAll(".zz").forEach((z, i) => {
        const t = at(L(10).start + 1.0 + i * 0.75);
        tl.fromTo(z, { opacity: 1, x: 0, y: 0, scale: 0.6 }, { opacity: 0, x: 40, y: -190, scale: 1.3, duration: 1.3, ease: "none", immediateRender: false }, t);
      });
      eyesShut(L(11).start);
      riser(brk, gmail);

      // ================= Scene 4: gmail (drop) =================
      palette("gmail", gmail);
      tl.set(human, { opacity: 0.35 }, at(gmail));
      hide("#sheet", L(12).start);
      tl.set(always, { backgroundColor: "transparent", color: "#ffffff", borderColor: "#ffffff" }, at(L(12).start));
      text(always, "Allow always", L(12).start);
      text("#dlg-head", "permission request · gmail", L(12).start);
      dialog(L(12).start, "open dave@acme.dev", "read all mail", SIZES[3]);
      show(agent, L(12).start);
      const selfYes = L(13).start;
      glide(agent, yesX(SIZES[3]), BTN_Y, selfYes, 1.4);
      click(agent, yes, selfYes, LIME);
      hide("#dlg", selfYes + 0.2);
      show("#sheet", selfYes + 0.2);
      show("#mail", selfYes + 0.2);
      glide(agent, 780, 810 + 404, L(14).start, 0.4);
      text("#mail-state", "read", L(14).start);
      // Six digits, one per half beat.
      const halves = [];
      T.beats.forEach((b) => halves.push(b, b + T.beatPeriod / 2));
      halves
        .filter((h) => h >= L(14).start - 1e-6)
        .slice(0, 6)
        .forEach((h, i) => {
          show(digits[i], h);
          pop(boxes[i], h);
        });
      const itsYou = L(15).start;
      text("#sheet-title", "identity confirmed", itsYou);
      text("#sheet-note", "welcome back, dave", itsYou);
      tl.set(boxes, { backgroundColor: LIME, color: "#0e0b1f" }, at(itsYou));
      text("#label", "dave", itsYou);
      tl.set("#label", { backgroundColor: LIME, color: "#0e0b1f" }, at(itsYou));
      pop("#label", itsYou);
      glide(agent, 540, 640, itsYou + 0.6, 0.5);
      hide(agent, itsYou + 0.6);

      // ================= Scene 5: 03:00 standup =================
      palette("night", night);
      hide("#sheet", night);
      hide(human, night);
      tl.set("#pulse", { opacity: 0 }, at(night));
      text("#ui-right", "03:00", L(16).start);
      text("#ui-left", "standup · daily", L(17).start);
      text("#counter", "attending: 0", L(17).start);
      hide("#char", nightDrop);
      hide("#label", nightDrop);
      show("#grid", nightDrop);
      const NAMES = ["dave", "priya", "tom", "mei", "sam", "ana", "lee", "raj", "kim", "zoe", "fridge", "max"];
      const tiles = NAMES.map((name, i) => {
        const tile = B.el("div", "tile", $("grid"));
        tile.style.left = (i % 3) * 311 + "px";
        tile.style.top = Math.floor(i / 3) * 235 + "px";
        if (name === "fridge") {
          B.el("div", "fridge", tile);
        } else {
          const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          tile.appendChild(svg);
          const e = B.drawCharacter(svg, 8);
          e.eyesA.style.opacity = "var(--ea)";
          e.eyesB.style.opacity = "var(--eb)";
        }
        tile.tag = B.el("div", "tag", tile, name);
        return tile;
      });
      // One tile joins per beat.
      beats(nightDrop, chant)
        .slice(0, tiles.length)
        .forEach((b, i) => {
          show(tiles[i], b);
          pop(tiles[i], b);
          text("#counter", "attending: " + (i + 1), b);
        });
      // "i am dave", "i am priya": the name tag lights while the line is sung.
      [
        [18, 0],
        [19, 1],
      ].forEach(([line, i]) => {
        tl.set(tiles[i].tag, { backgroundColor: LIME, color: "#0e0b1f" }, at(L(line).start));
        tl.set(tiles[i], { outlineColor: LIME }, at(L(line).start));
        tl.set(tiles[i].tag, { backgroundColor: "#000000", color: "#ffffff" }, at(L(line).end + 0.5));
        tl.set(tiles[i], { outlineColor: "transparent" }, at(L(line).end + 0.5));
      });
      // After everyone has joined, the speaker frame steps round the grid on the beat.
      const ORDER = [4, 9, 2, 7, 0, 11, 5, 10, 1, 8, 3, 6];
      B.BeatStepper(tl, T, {
        targets: ORDER.map((i) => tiles[i]),
        from: bar(22),
        to: morning,
        on: { outlineColor: LIME },
        off: { outlineColor: "transparent" },
      });
      // Chant: one syllable per pop, twice.
      tl.set("#grid", { opacity: 0.28 }, at(chant));
      tl.set(tiles.map((x) => x.tag), { opacity: 0 }, at(chant));
      [22, 23].forEach((line) => {
        const [wNo, wBl] = T.words.filter((w) => w.line === line);
        const mid = (wBl.start + wBl.end) / 2;
        const until = line === 22 ? L(23).start : morning;
        [
          ["no", wNo.start],
          ["block", wBl.start],
          ["ers", mid],
        ].forEach(([s, t], k) => {
          const n = B.el("div", "syl", $("chant"), s);
          n.style.top = 420 + k * 260 + "px";
          tl.fromTo(n, { opacity: 1, scale: 1.1 }, { opacity: 1, scale: 1, duration: 2 / T.fps, ease: "none", immediateRender: false }, at(t));
          hide(n, until);
        });
      });

      // ================= Scene 6: morning (break) =================
      palette("morning", morning);
      hide("#grid", morning);
      show("#char", morning);
      show("#label", morning);
      text("#ui-right", "09:00", morning);
      text("#ui-left", "~/acme/web-app", morning);
      text("#counter", "prompts today: 0", morning);
      const ask = L(25).start;
      text("#dlg-head", "permission request · from: human", ask);
      text(always, "Deny always", ask);
      dialog(ask, "read ./notes.txt", "human wants to read their own file", MORNING);
      text("#counter", "prompts today: 1", ask);
      const tNo = L(26).start;
      show(agent, L(25).end);
      glide(agent, noX(MORNING), BTN_Y, tNo, 1.6);
      click(agent, no, tNo, "#ffffff");
      // Cut back to the opening frame so the clip loops.
      palette("intro", cut);
      tl.set(root, { "--char-body": "#4a4566", "--char-eye": "#2a2640" }, at(cut));
      hide("#dlg", cut);
      hide(agent, cut);
      hide("#label", cut);
      text("#counter", "prompts today: 0", cut);

      B.holdTo(tl, T);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
