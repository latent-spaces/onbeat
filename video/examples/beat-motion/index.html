<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Beat motion demo: SpriteDance + SyncCheck</title>
  <script src="assets/gsap.min.js"></script>
  <script src="timing.js"></script>
  <script src="src/spritedance.js"></script>
  <script src="src/synccheck.js"></script>
  <style>
    * {box-sizing:border-box} html,body {margin:0;width:1080px;height:1920px;overflow:hidden;background:#1c2e3d}
    #root {position:relative;width:100%;height:100%;overflow:hidden}
    #space {position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover}
    .actor {position:absolute;width:760px;height:760px;top:640px}
    .sprite {position:absolute;inset:0;background-repeat:no-repeat;background-size:400% 400%}
    .ochre {background-image:url('assets/ochre-dance.webp')}
    .blue {background-image:url('assets/blue-dance.webp')}
    .robot {background-image:url('assets/robot-dance.webp')}
    .left {left:-100px} .center {left:160px} .right {left:350px}
  </style>
</head>
<body>
  <div id="root" data-composition-id="beat-motion" data-width="1080" data-height="1920" data-duration="11.5191" data-fps="30" data-layout-allow-overlap data-layout-allow-overflow>
    <img id="space" class="clip" src="assets/space.png" alt="" data-start="0" data-duration="11.5191" data-track-index="1">
    <div class="actor left"><div id="ochre" class="sprite ochre"></div></div>
    <div class="actor right"><div id="blue" class="sprite blue"></div></div>
    <div class="actor center"><div id="robot" class="sprite robot"></div></div>
    <audio id="chorus" class="clip" src="assets/chorus.wav" data-start="0" data-duration="11.5191" data-track-index="0"></audio>
  </div>
  <script>
    window.REEL_CONFIG = { syncCheck: true };
    const T = window.TIMING;
    const tl = gsap.timeline({ paused: true });
    // Three dancers, 16 poses per bar, phases 0 / 8 / 4, hop + squash on every beat, bigger on bar 1.
    SpriteDance.cast(tl, T, [{ target: "#ochre" }, { target: "#blue" }, { target: "#robot" }], {
      from: 0,
      to: T.duration,
      cols: 4,
      bounce: { px: 16, squash: 0.05, downbeat: 1.8 },
    });
    if (SyncCheck.wanted()) SyncCheck.overlay(tl, T, { parent: document.getElementById("root") });
    tl.set({}, {}, T.duration);
    window.__timelines = window.__timelines || {};
    window.__timelines["beat-motion"] = tl;
  </script>
</body>
</html>
