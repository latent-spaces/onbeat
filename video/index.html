<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="src/beatsync.js"></script>
    <script src="data/stub-short.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0e0b1f;
      }
      #root {
        /* Hook world; PaletteCut swaps these at the drop. */
        --bg: #0e0b1f;
        --ink: #f2eee3;
        --led-off: #1f1b3a;
        --accent: #c8f03c;
        --pulse: #2a2550;
        --mono: #8c87b0;
        --char-body: #4a4566;
        --char-eye: #2a2640;
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #bg {
        position: absolute;
        inset: 0;
        background: var(--bg);
      }
      .mono {
        position: absolute;
        top: 150px;
        font-family: "JetBrains Mono", monospace;
        font-size: 34px;
        color: var(--mono);
        letter-spacing: 0.02em;
      }
      #ui-left {
        left: 84px;
      }
      #ui-right {
        right: 84px;
        text-align: right;
      }
      #leds {
        position: absolute;
        top: 236px;
        left: 84px;
        width: 912px;
        height: 40px;
        display: flex;
        gap: 8px;
      }
      .led {
        flex: 1;
        background: var(--led-off);
      }
      #pulse {
        position: absolute;
        left: 260px;
        top: 380px;
        width: 560px;
        height: 560px;
        background: var(--pulse);
        opacity: 0;
      }
      #char {
        position: absolute;
        left: 408px;
        top: 495px;
        width: 264px;
        height: 330px;
      }
      #lyrics {
        position: absolute;
        inset: 0;
      }
      .lyric {
        position: absolute;
        left: 84px;
        font-family: "Inter", sans-serif;
        font-weight: 900;
        font-size: 120px;
        line-height: 130px;
        letter-spacing: -0.045em;
        color: var(--ink);
        white-space: nowrap;
        opacity: 0;
      }
      .lyric.syl {
        color: var(--accent);
      }
      #riser {
        position: absolute;
        left: 84px;
        top: 1720px;
        width: 912px;
        height: 12px;
        background: var(--led-off);
      }
      #riser-fill {
        width: 100%;
        height: 100%;
        background: var(--accent);
        transform-origin: 0 50%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="14.948"
      data-fps="60"
      data-width="1080"
      data-height="1920"
    >
      <audio id="music" class="clip" src="assets/dev/dev8bars.wav" data-start="0" data-track-index="0" data-volume="1"></audio>
      <div id="bg"></div>
      <div id="ui-left" class="mono">blip/dev-01</div>
      <div id="ui-right" class="mono">standby</div>
      <div id="leds"></div>
      <div id="pulse"></div>
      <svg id="char"></svg>
      <div id="lyrics"></div>
      <div id="riser"><div id="riser-fill"></div></div>
    </div>
    <script>
      // Scene plan for the 8-bar dev clip. Every time comes from window.TIMING.
      const T = window.TIMING;
      const B = window.BeatSync;
      const tl = gsap.timeline({ paused: true });
      const root = document.getElementById("root");
      const lyrics = document.getElementById("lyrics");
      const drop = T.bars[4];
      const end = T.duration;

      const leds = [];
      for (let i = 0; i < 16; i++) leds.push(B.el("div", "led", document.getElementById("leds")));
      const eyes = B.drawCharacter(document.getElementById("char"), 22);

      // Bars 0-3: vocal layer only.
      B.CharacterStates(tl, T, {
        target: root,
        onColor: "#c8f03c",
        eyeColor: "#0e0b1f",
        eyesA: eyes.eyesA,
        eyesB: eyes.eyesB,
        eyesFrom: drop,
        eyesTo: end,
      });
      B.DropLine(tl, T, { line: 0, parent: lyrics, y: 1060, until: T.lines[2].start });
      B.DropLine(tl, T, { line: 1, parent: lyrics, y: 1190, until: T.lines[2].start });
      const karaHook = { unsung: "#f2eee3", current: "#c8f03c", sung: "#6f6a90" };
      B.KaraokeLine(tl, T, { line: 2, parent: lyrics, y: 1060, until: drop, ...karaHook });
      B.KaraokeLine(tl, T, { line: 3, parent: lyrics, y: 1190, until: drop, ...karaHook });
      B.ProgressRiser(tl, T, {
        target: "#riser-fill",
        hideTarget: "#riser",
        from: T.bars[0],
        to: drop,
        hideAt: T.beats[17],
      });

      // Bar 4: the drop. Palette cut, beat layer on.
      B.PaletteCut(tl, T, {
        target: root,
        bar: 4,
        palette: {
          "--bg": "#2b3cff",
          "--ink": "#ffffff",
          "--led-off": "#4251ff",
          "--pulse": "#5563ff",
          "--mono": "#c9cdff",
        },
      });
      B.BeatStepper(tl, T, {
        targets: leds,
        from: drop,
        to: end,
        on: { backgroundColor: "#c8f03c" },
        off: { backgroundColor: "var(--led-off)" },
      });
      B.BeatTicker(tl, T, {
        target: "#ui-right",
        from: drop,
        to: end,
        text: (i, t) => `bar ${String(Math.floor(i / t.beatsPerBar) + 1).padStart(2, "0")}.${(i % t.beatsPerBar) + 1}`,
      });
      B.BeatPulse(tl, T, { target: "#pulse", from: drop, to: end, scaleFrom: 1.06 });

      // Bars 4-7: vocal layer over the beat layer.
      B.SyllableStack(tl, T, { line: 4, parent: lyrics, y: 990, cls: "syl", until: T.lines[5].start });
      B.DropLine(tl, T, { line: 5, parent: lyrics, y: 1060 });
      const karaDrop = { unsung: "#ffffff", current: "#c8f03c", sung: "#8f99ff" };
      B.KaraokeLine(tl, T, { line: 6, parent: lyrics, y: 1190, ...karaDrop });

      B.holdTo(tl, T);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
