<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>music-reel</title>
  <script src="assets/gsap.min.js"></script>
  <script src="data/timing.js"></script>
  <script src="data/config.js"></script>
{{SRC_SCRIPTS}}
  <script src="reel-extras.js"></script>
  <style>
    * { box-sizing: border-box }
    html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000 }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden;
      --bg1: #1b1033; --bg2: #3a1450; --accent: #ff4fa3; --ink: #fff2c4; --sung: #ffd34d }
    .layer { position: absolute; inset: 0 }
    #bg { background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%) }
    #sun { position: absolute; left: 190px; top: 540px; width: 700px; height: 700px; border-radius: 50%;
      background: radial-gradient(circle at 50% 40%, var(--sung), var(--accent) 70%); transform-origin: 50% 50% }
    #sunglow { position: absolute; left: 90px; top: 440px; width: 900px; height: 900px; border-radius: 50%;
      background: radial-gradient(circle, var(--accent) 0%, transparent 65%); opacity: 0 }
    #floor { position: absolute; left: -200px; right: -200px; top: 1180px; bottom: -200px;
      background: repeating-linear-gradient(90deg, transparent 0 118px, var(--accent) 118px 122px),
                  repeating-linear-gradient(0deg, transparent 0 78px, var(--accent) 78px 82px);
      transform: perspective(600px) rotateX(58deg); transform-origin: 50% 0; opacity: .55 }
    #flash { background: var(--ink); opacity: 0 }
    #title { position: absolute; left: 80px; right: 80px; top: 1380px; text-align: center; color: var(--ink);
      font: 800 110px/1.05 "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: -.01em; text-transform: uppercase;
      text-shadow: 0 6px 0 rgba(0,0,0,.35) }
    #subtitle { position: absolute; left: 80px; right: 80px; top: 1640px; text-align: center; color: var(--ink); opacity: .8;
      font: 600 44px/1.2 "Helvetica Neue", Helvetica, Arial, sans-serif }
    .lyric { position: absolute; left: 70px; right: 70px; text-align: center; opacity: 0; color: var(--ink);
      font: italic 800 92px/1.1 "Helvetica Neue", Helvetica, Arial, sans-serif; text-transform: uppercase;
      text-shadow: 4px 4px 0 var(--accent), 0 0 30px rgba(0,0,0,.4) }
    #cast { position: absolute; left: 0; right: 0; top: 760px; height: 900px }
  </style>
</head>
<body>
  <div id="root" data-composition-id="music-reel" data-width="1080" data-height="1920"
       data-duration="{{DURATION}}" data-fps="{{FPS}}">
    <div id="bg" class="layer"></div>
    <div id="sunglow"></div>
    <div id="sun"></div>
    <div id="floor"></div>
    <div id="cast"></div>
    <div id="flash" class="layer"></div>
    <div id="lyrics" class="layer"></div>
    <div id="title"></div>
    <div id="subtitle"></div>
    <audio id="song" src="assets/song.wav" data-start="0" data-duration="{{DURATION}}" data-track-index="0"></audio>
  </div>
  <script>
  (function () {
    var T = window.TIMING, C = window.REEL || {}, B = window.BeatSync, fps = T.fps;
    var root = document.getElementById("root");
    var pal = C.palette || {};
    Object.keys(pal).forEach(function (k) { root.style.setProperty("--" + k, pal[k]); });

    var tl = gsap.timeline({ paused: true });
    var at = function (t) { return B.at(t, fps); };
    var end = T.duration;

    // Title card: on screen until the first lyric (or the first kick section), then out on a bar line.
    var firstKick = (T.sections || []).filter(function (s) { return s.kick; })[0];
    var titleOut = T.lines && T.lines.length ? T.lines[0].start : (firstKick ? firstKick.start : (T.bars[2] || 2));
    document.getElementById("title").textContent = C.title || "";
    document.getElementById("subtitle").textContent = C.subtitle || "";
    tl.set(["#title", "#subtitle"], { opacity: 1 }, 0);
    tl.set(["#title", "#subtitle"], { opacity: 0 }, at(Math.max(0.5, titleOut - 0.01)));

    // Beat clock: the sun pulses on every beat, harder on bar downbeats and only where the kick plays.
    var kickAt = function (t) {
      var s = (T.sections || []).filter(function (x) { return t >= x.start - 1e-6 && t < x.end - 1e-6; })[0];
      return s ? s.kick : true;
    };
    var bars = T.bars.map(function (b) { return Math.round(b * 1000); });
    T.beats.forEach(function (b) {
      var down = bars.indexOf(Math.round(b * 1000)) >= 0, kick = kickAt(b);
      var amp = kick ? (down ? 1.12 : 1.05) : 1.015;
      tl.fromTo("#sun", { scale: amp }, { scale: 1, duration: T.beatPeriod * 0.85, ease: "expo.out", immediateRender: false }, at(b));
      if (kick) tl.fromTo("#sunglow", { opacity: down ? 0.9 : 0.5 }, { opacity: 0, duration: T.beatPeriod * 0.9, ease: "expo.out", immediateRender: false }, at(b));
    });
    // Floor scrolls one tile per beat (a pure function of time: one linear tween over the song).
    tl.fromTo("#floor", { backgroundPosition: "0px 0px, 0px 0px" },
      { backgroundPosition: "0px 0px, 0px " + (80 * T.beats.length) + "px", duration: end, ease: "none", immediateRender: false }, 0);
    // A white flash on each section change into a kick section (the drop).
    (T.sections || []).forEach(function (s, i) {
      if (i > 0 && s.kick && !T.sections[i - 1].kick) {
        tl.fromTo("#flash", { opacity: 0.85 }, { opacity: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, at(s.start));
      }
    });

    // Voice clock: karaoke when words exist, whole lines when only lines exist,
    // otherwise captions from reel.json placed on bars (beats-only mode).
    var lyrics = document.getElementById("lyrics"), y = C.lyricsY || 260;
    var hasWords = T.words && T.words.length, hasLines = T.lines && T.lines.length;
    if (hasLines) {
      T.lines.forEach(function (ln, i) {
        var until = i + 1 < T.lines.length ? Math.min(T.lines[i + 1].start, ln.end + 1.5) : Math.min(end, ln.end + 1.5);
        if (hasWords) B.KaraokeLine(tl, T, { line: i, parent: lyrics, y: y, unsung: "rgba(255,255,255,.55)", current: pal.sung || "#ffd34d", sung: pal.ink || "#fff2c4", until: until });
        else B.DropLine(tl, T, { line: i, parent: lyrics, y: y, until: until });
      });
    } else if (C.captions && C.captions.length) {
      var every = C.captionBars || 2, start = C.captionStartBar != null ? C.captionStartBar : (firstKick ? firstKick.startBar : 0);
      C.captions.forEach(function (text, i) {
        var bar = start + i * every;
        if (bar >= T.bars.length) return;
        var t0 = T.bars[bar], t1 = bar + every < T.bars.length ? T.bars[bar + every] : end;
        var node = B.el("div", "lyric", lyrics, text);
        node.style.top = y + "px";
        tl.set(node, { opacity: 1 }, at(t0));
        tl.fromTo(node, { y: -80 }, { y: 0, duration: 6 / fps, ease: "power3.out", immediateRender: false }, at(t0));
        tl.set(node, { opacity: 0 }, at(t1));
      });
    }

    // Optional extras (sprite cast, sync-check overlay) from src/reel-extras.js.
    if (window.ReelExtras) window.ReelExtras.apply(tl, T, C, root);

    B.holdTo(tl, T);
    window.__timelines = window.__timelines || {};
    window.__timelines["music-reel"] = tl;
  })();
  </script>
</body>
</html>
