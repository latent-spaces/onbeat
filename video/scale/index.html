<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="src/beatsync.js"></script>
    <script src="data/stub-long.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0e0b1f;
      }
      #root {
        /* Hook world; PaletteCut swaps these at the drop. */
        --bg: #0e0b1f;
        --ink: #f2eee3;
        --led-off: #1f1b3a;
        --accent: #c8f03c;
        --pulse: #2a2550;
        --mono: #8c87b0;
        --char-body: #4a4566;
        --char-eye: #2a2640;
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #bg {
        position: absolute;
        inset: 0;
        background: var(--bg);
      }
      .mono {
        position: absolute;
        top: 150px;
        font-family: "JetBrains Mono", monospace;
        font-size: 34px;
        color: var(--mono);
        letter-spacing: 0.02em;
      }
      #ui-left {
        left: 84px;
      }
      #ui-right {
        right: 84px;
        text-align: right;
      }
      #leds {
        position: absolute;
        top: 236px;
        left: 84px;
        width: 912px;
        height: 40px;
        display: flex;
        gap: 8px;
      }
      .led {
        flex: 1;
        background: var(--led-off);
      }
      #pulse {
        position: absolute;
        left: 260px;
        top: 380px;
        width: 560px;
        height: 560px;
        background: var(--pulse);
        opacity: 0;
      }
      #char {
        position: absolute;
        left: 408px;
        top: 495px;
        width: 264px;
        height: 330px;
      }
      #lyrics {
        position: absolute;
        inset: 0;
      }
      .lyric {
        position: absolute;
        left: 84px;
        font-family: "Inter", sans-serif;
        font-weight: 900;
        font-size: 120px;
        line-height: 130px;
        letter-spacing: -0.045em;
        color: var(--ink);
        white-space: nowrap;
        opacity: 0;
      }
      .lyric.syl {
        color: var(--accent);
      }
      #riser {
        position: absolute;
        left: 84px;
        top: 1720px;
        width: 912px;
        height: 12px;
        background: var(--led-off);
      }
      #riser-fill {
        width: 100%;
        height: 100%;
        background: var(--accent);
        transform-origin: 0 50%;
      }
      #grid {
        position: absolute;
        top: 300px;
        left: 84px;
        width: 912px;
        height: 40px;
        display: flex;
        gap: 8px;
      }
      .cell {
        flex: 1;
        background: var(--led-off);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="44.697"
      data-fps="60"
      data-width="1080"
      data-height="1920"
    >
      <audio id="music" class="clip" src="assets/dev/dev24bars.wav" data-start="0" data-track-index="0" data-volume="1"></audio>
      <div id="bg"></div>
      <div id="ui-left" class="mono">blip/scale-test</div>
      <div id="ui-right" class="mono">standby</div>
      <div id="leds"></div>
      <div id="grid"></div>
      <div id="pulse"></div>
      <svg id="char"></svg>
      <div id="lyrics"></div>
      <div id="riser"><div id="riser-fill"></div></div>
    </div>
    <script>
      // Scale test: 24 bars, 96 beats, per-beat steppers on several elements, 120 karaoke words.
      const T = window.TIMING;
      const B = window.BeatSync;
      const tl = gsap.timeline({ paused: true });
      const root = document.getElementById("root");
      const lyrics = document.getElementById("lyrics");
      const end = T.duration;

      const leds = [];
      const cells = [];
      for (let i = 0; i < 16; i++) leds.push(B.el("div", "led", document.getElementById("leds")));
      for (let i = 0; i < 16; i++) cells.push(B.el("div", "cell", document.getElementById("grid")));
      const eyes = B.drawCharacter(document.getElementById("char"), 22);

      B.CharacterStates(tl, T, {
        target: root, onColor: "#c8f03c", eyeColor: "#0e0b1f",
        eyesA: eyes.eyesA, eyesB: eyes.eyesB, eyesFrom: T.bars[4], eyesTo: end,
      });
      // Every beat from bar 0 so the beat layer is dense across the whole clip.
      B.BeatStepper(tl, T, { targets: leds, from: 0, to: end, on: { backgroundColor: "#c8f03c" }, off: { backgroundColor: "var(--led-off)" } });
      // A second grid stepping backwards, so two steppers change on every beat.
      B.BeatStepper(tl, T, { targets: cells.slice().reverse(), from: 0, to: end, on: { backgroundColor: "#ff5fa2" }, off: { backgroundColor: "var(--led-off)" } });
      B.BeatTicker(tl, T, {
        target: "#ui-right", from: 0, to: end,
        text: (i, t) => `bar ${String(Math.floor(i / t.beatsPerBar) + 1).padStart(2, "0")}.${(i % t.beatsPerBar) + 1}`,
      });
      B.BeatPulse(tl, T, { target: "#pulse", from: T.bars[4], to: end, scaleFrom: 1.06 });
      B.ProgressRiser(tl, T, { target: "#riser-fill", hideTarget: "#riser", from: 0, to: T.bars[4], hideAt: T.beats[17] });

      // Palette cut every 4 bars, alternating two worlds.
      const worlds = [
        { "--bg": "#2b3cff", "--ink": "#ffffff", "--led-off": "#4251ff", "--pulse": "#5563ff", "--mono": "#c9cdff" },
        { "--bg": "#0e0b1f", "--ink": "#f2eee3", "--led-off": "#1f1b3a", "--pulse": "#2a2550", "--mono": "#8c87b0" },
      ];
      for (let bar = 4; bar < T.bars.length; bar += 4) B.PaletteCut(tl, T, { target: root, bar, palette: worlds[(bar / 4 + 1) % 2] });

      // 24 karaoke lines, two on screen at a time.
      const kara = { unsung: "#d8d4ff", current: "#c8f03c", sung: "#8f99ff" };
      T.lines.forEach((line, i) => {
        const next2 = T.lines[i + 2 - (i % 2)];
        B.KaraokeLine(tl, T, { line: i, parent: lyrics, y: 1060 + (i % 2) * 130, until: next2 ? next2.start : null, ...kara });
      });

      B.holdTo(tl, T);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
